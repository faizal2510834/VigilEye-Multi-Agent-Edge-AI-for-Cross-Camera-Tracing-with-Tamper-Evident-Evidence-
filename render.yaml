services:
  - type: web
    name: vigileye-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PREDICTIVE_HANDOFF_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "https://vigileye.vercel.app" # example frontend domain
